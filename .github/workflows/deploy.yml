name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arthurtoppenberg/personalwebsite:latest
            ghcr.io/arthurtoppenberg/personalwebsite:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/known_hosts <<'EOF'
          169.58.80.104 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOPkkGk87JKT7O5D2ecm3tpGH7ehNgKtRKoafPxFa1q6
          EOF
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@169.58.80.104

      - name: Verify
        run: curl -sf -o /dev/null -w "%{http_code}\n" https://arthurtoppenberg.dk
